{{ $url := .Destination }}
{{ $resolved := $url }}
{{ if or (strings.HasPrefix $url "http://") (strings.HasPrefix $url "https://") }}
  {{ $resolved = $url }}
{{ else }}
  {{ $resolved = strings.TrimPrefix "/" $url | relURL }}
{{ end }}
<img src="{{ $resolved }}" alt="{{ .Text }}" {{ with .Title }}title="{{ . }}"{{ end }} />
